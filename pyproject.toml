[project]
name = "stardew-mcp-server"
version = "0.1.0"
description = "MCP server exposing the HelloStardew calendar HTTP API (dates, birthdays, festivals)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
]

[project.scripts]
stardew-mcp-server = "stardew_mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
